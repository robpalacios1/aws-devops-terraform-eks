# global variables of Infrastructure
environment: dev
awsRegion: us-east-1
accountId: ""

# list of microservices to deploy
services:
  orders-service:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"


  products-service:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"


  users-service:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"

  
