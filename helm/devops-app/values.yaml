# global variables of Infrastructure
environment: dev
awsRegion: us-east-1

# list of microservices to deploy
services:
  orders-services:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"


  products-services:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"


  users-services:
    enabled: true
    replicaCount: 2
    port: 3000
    resources:
      requests:
        memory: "64Mi"
        cpu: "256m"
      limits:
        memory: "128Mi"
        cpu: "512m"

  
