# ====================================================================
# 1. SERVICE FOR ORDERS SERVICE
# ====================================================================  

apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: default
  labels:
    app: orders-service
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  selector:
    app: orders-service

---

