name: CI Pipeline

on:
    pull_request:
        branches:
            - development
            - staging
            - master
            - feature/*

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm run test

            - name: Build Project
              run: npm run build